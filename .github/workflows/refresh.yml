name: Refresh KPI data

# Keeps the static KPI page (docs/index.html) fresh so "نسخ اليوم" reflects
# today's applications. Runs every 15 min during working hours (UTC 02–17 ≈
# UAE 06–22). Pages deploys automatically from master/docs on each commit.

on:
  schedule:
    - cron: "*/15 2-17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kpi-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # fail fast — DB hang was causing 15-min hangs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet psycopg2-binary

      - name: Rebuild docs from live DB
        timeout-minutes: 3    # hard kill if script hangs
        run: python build_static.py

      - name: Commit refreshed data
        run: |
          git config user.name "kpi-refresh-bot"
          git config user.email "kpi-refresh-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "auto: refresh live KPI data"
          git push
